[project]
name = "compaction"
version = "0.1.0"
description = "ML-based compaction prediction for lakehouse table formats"
requires-python = ">=3.10"

dependencies = [
    "pyspark==3.5.4",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.8",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["code*"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
